name: Deploy to GitHub Pages

# 源码仓库 push 后自动构建并发布到 qianlixun.github.io（消除"源码新、线上旧"漂移）
on:
  push:
    branches: [master, vue3-migration]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Vite 5 需要 Node 18+
          cache: npm

      # 仓库 .gitignore 忽略了 package-lock.json，故使用 npm install 而非 npm ci
      - run: npm install

      - run: npm run build

      - name: Deploy to Qianlixun/qianlixun.github.io (master)
        # 未配置 DEPLOY_KEY 时跳过，仅跑构建
        if: ${{ secrets.DEPLOY_KEY != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          publish_dir: ./dist
          external_repository: Qianlixun/qianlixun.github.io
          publish_branch: master
          force_orphan: false
