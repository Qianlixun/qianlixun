name: Deploy to GitHub Pages

# 源码仓库 push 后自动构建并发布到 qianlixun.github.io（消除"源码新、线上旧"漂移）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 把 secret 注入到 job 级 env，供下方 if 条件判断（secrets 上下文不能直接用于 if 表达式）
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Vite 5 需要 Node 18+
          cache: npm

      # 锁文件已提交，npm ci 按 package-lock.json 精确还原依赖
      - run: npm ci

      - run: npm run build

      - name: Deploy to Qianlixun/qianlixun.github.io (master)
        # 未配置 DEPLOY_KEY 时跳过，仅跑构建
        if: ${{ env.DEPLOY_KEY != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          publish_dir: ./dist
          external_repository: Qianlixun/qianlixun.github.io
          publish_branch: master
          force_orphan: false
