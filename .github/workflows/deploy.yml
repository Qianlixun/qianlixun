name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        # 仓库 .gitignore 忽略了 package-lock.json，故使用 npm install 而非 npm ci
        run: npm install

      - name: Build
        # Vue CLI 4 基于 webpack 4，在 Node 17+ 下需启用 legacy OpenSSL provider
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Deploy to qianlixun.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: Qianlixun/qianlixun.github.io
          publish_branch: master
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
